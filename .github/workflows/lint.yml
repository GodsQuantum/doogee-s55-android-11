name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-public-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck zstd xz-utils

      - name: Lint
        run: make lint
